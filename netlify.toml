[build]
  publish = "."           # folder where index.html lives
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Usage counting (GoatCounter), routed through this site so ad blockers don't stop it
[[redirects]]
  from = "/lib/helper.js"
  to = "https://gc.zgo.at/count.js"
  status = 200
  force = true

[[redirects]]
  from = "/lib/ping"
  to = "https://kbmooreut.goatcounter.com/count"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
